name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  # ── 1. Install & cache ────────────────────────────────────────────────────
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            artifacts/*/node_modules
            lib/*/node_modules
            scripts/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

  # ── 2. Typecheck ──────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    needs: install
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            artifacts/*/node_modules
            lib/*/node_modules
            scripts/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node_modules-${{ runner.os }}-

      - name: Install (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

  # ── 3. API integration tests ──────────────────────────────────────────────
  test:
    name: API integration tests
    runs-on: ubuntu-latest
    needs: install

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: payos_test
          POSTGRES_USER: payos
          POSTGRES_PASSWORD: payos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://payos:payos@localhost:5432/payos_test
      SESSION_SECRET: ci-test-secret-min-32-chars-long-enough
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            artifacts/*/node_modules
            lib/*/node_modules
            scripts/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node_modules-${{ runner.os }}-

      - name: Install (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Push database schema
        run: pnpm --filter @workspace/db run push

      - name: Run API integration tests
        run: pnpm --filter @workspace/api-server run test

  # ── 4. API server build ───────────────────────────────────────────────────
  build-api:
    name: Build API server
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            artifacts/*/node_modules
            lib/*/node_modules
            scripts/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node_modules-${{ runner.os }}-

      - name: Install (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

  # ── 5. Web app build ──────────────────────────────────────────────────────
  # The web-app Vite config requires BASE_PATH (injected by Replit at deploy
  # time). We supply a placeholder here so the build completes in CI.
  build-web:
    name: Build web app
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      BASE_PATH: /
      PORT: "5173"
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Restore node_modules
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            artifacts/*/node_modules
            lib/*/node_modules
            scripts/node_modules
          key: node_modules-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: node_modules-${{ runner.os }}-

      - name: Install (fallback if cache miss)
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm --filter @workspace/web-app run build
