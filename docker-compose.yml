# Local development only — NOT for production.
# Requires Docker Engine or Docker Desktop.
# Not usable in the Replit hosted environment (no Docker daemon).
#
# Usage:
#   docker compose up --build   # first run — builds images + starts services
#   docker compose up           # subsequent runs

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: payos
      POSTGRES_PASSWORD: payos_dev
      POSTGRES_DB: payos
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payos"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: artifacts/api-server/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgres://payos:payos_dev@db:5432/payos
      SESSION_SECRET: dev-docker-secret-do-not-use-in-production
    ports:
      - "4000:4000"
    command: >
      sh -c "
        cd /workspace &&
        pnpm --filter @workspace/db run push &&
        pnpm --filter @workspace/scripts run seed &&
        cd /workspace/artifacts/api-server &&
        pnpm run dev
      "

  web:
    build:
      context: .
      dockerfile: artifacts/web-app/Dockerfile.dev
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: development
      PORT: "5173"
    ports:
      - "5173:5173"

volumes:
  pgdata:
